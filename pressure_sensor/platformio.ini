[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
monitor_flags =
    --filter
    debug
    --filter
    send_on_enter
    --echo
    --eol
    LF

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
monitor_flags =
    --filter
    debug
    --filter
    send_on_enter
    --echo
    --eol
    LF
